# Publishing an addon from its tag, quest-0.9.1, recipe-0.9.1 or hud-0.9.1: the GitHub release with its zip, then the
# file on CurseForge. What it does and checks: tools/release.py. The CurseForge token is the repository's secret
# CF_API_TOKEN. "Run workflow" on the Actions page tries a tag's run from a branch without uploading anything, the
# CurseForge token and the game version tried too.
name: Publish

on:
  push:
    tags: ["quest-*", "recipe-*", "hud-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "A tag to try, as quest-0.9.1: built from the branch, CurseForge's token tried, nothing sent"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Lua for the package check
        run: python -I -m pip install --quiet --target tools/pylib lupa
      - name: Publish
        if: github.event_name == 'push'
        run: python -I tools/release.py "$GITHUB_REF_NAME"
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
      - name: Try, uploading nothing
        if: github.event_name == 'workflow_dispatch'
        run: python -I tools/release.py "$TAG" --dry-run
        env:
          TAG: ${{ inputs.tag }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
